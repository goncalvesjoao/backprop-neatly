[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backprop-neatly"
version = "0.0.1"
description = "NumPy implementation and evaluation of backpropagation, NEAT, and NEAT+backpropagation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.4.0rc1,<1.5",
    "numpy>=2.4.6",
    "omegaconf>=2.4.0.dev0,<2.5",
]

[project.scripts]
backprop-neatly = "backprop_neatly.experiment:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backprop_neatly"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.50",
]

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
